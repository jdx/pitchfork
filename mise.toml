[env]
_.path = ["target/debug", "test/bats/bin"]

[tasks.test]
depends = ["build:ui"]
run = [
  "cargo nextest run",
  "git submodule update --init --recursive",
  "mise run test:bats",
]

[tasks."test:bats"]
description = "Run bats e2e tests"
run = '''
if [ -n "$TRANCHE" ] && [ -n "$TRANCHE_COUNT" ]; then
  tests=$(ls -1 test/*.bats | sort | awk -v t="$TRANCHE" -v n="$TRANCHE_COUNT" 'NR % n == t')
else
  tests="test"
fi
if command -v parallel >/dev/null 2>&1; then
  bats --jobs 16 $tests
else
  echo "GNU parallel not found, running sequentially" >&2
  bats $tests
fi
'''

[tasks.build-dev]
description = "rebuild and restart supervisor (without sudo, as what Agent prefers), to make changes take effect"
depends = ["build"]
run = "pitchfork sup start -f"

[tasks.ci]
depends = ["lint", "build", "build:docs", "test", "test:web-ui"]

[tasks.ci-dev]
depends = ["lint-fix", "build", "build:docs", "test", "render"]

[tasks.docs]
dir = "docs"
run = "aube install && exec aube run docs:dev"

[tasks.lint]
depends = ["build:ui"]
run = "hk check --all"

[tasks.lint-fix]
depends = ["build:ui"]
run = "hk fix --all"

[tasks.build]
depends = ["build:ui"]
run = ["cargo build"]

[tasks."test:web-ui"]
depends = ["build"]
dir = "ui"
run = [
  "aube install",
  "if [ \"$(uname -s)\" = \"Linux\" ]; then node_modules/.bin/playwright install --with-deps chromium; else node_modules/.bin/playwright install chromium; fi",
  "node_modules/.bin/playwright test",
]

[tasks."build:ui"]
dir = "ui"
run = "aube install && exec aube run build && touch ../src/web/static_files.rs"
sources = ["src/**/*"]
outputs = ["dist/**/*"]

[tasks."build:docs"]
dir = "docs"
run = "aube install && exec aube run docs:build"

[tasks."build:usage"]
description = "Build the usage CLI matching the generated spec dialect"
run = "cargo install --force --git https://github.com/jdx/usage --rev 3c84ac415d26abc3033df78e1ba3efd2fdaf5c66 --locked --root .mise/usage-cli-6 usage-cli"
sources = ["Cargo.lock", "mise.toml"]
outputs = [".mise/usage-cli-6/bin/usage"]

[tasks.render]
depends = ["build", "build:usage"]
# Temporary until usage 6.x is released: render with the exact CLI revision that
# understands the dialect emitted by the git-pinned usage-rs dependency.
run = [
  "pitchfork usage > pitchfork.usage.kdl",
  "rm -rf docs/cli && mkdir -p docs/cli",
  ".mise/usage-cli-6/bin/usage g markdown -mf pitchfork.usage.kdl --out-dir docs/cli --url-prefix /cli",
  ".mise/usage-cli-6/bin/usage g json -f pitchfork.usage.kdl > docs/cli/commands.json",
  "pitchfork schema > docs/public/schema.json",
  "pitchfork api-schema > docs/public/api-schema.json",
  "git add pitchfork.usage.kdl docs",
]

[tasks.install-dev]
depends = ["build:ui"]
env = { "PITCHFORK_LOG" = "debug" }
run = [
  "cargo install --path . --debug",
  "pitchfork sup start -f",
]

[tools]
# Pinned rather than "latest" because tak is the measuring instrument: an
# upgrade that changes how it samples would land in the series as a step change
# in pitchfork's numbers, indistinguishable from a real regression. Bump deliberately.
"github:jdx/tak" = "v0.0.5"
aube = "latest"
cargo-binstall = "latest"
communique = "latest"
hk = "latest"
node = "24"
pkl = "latest"
"cargo:cargo-nextest" = "latest"
rust = "stable"

# Instruction-counted benchmarks (see tak.toml). Needs valgrind for the counts;
# without it tak reports wall clock only and says so, so this still works on
# macOS where there is no usable cachegrind.
# `depends` on build:ui because the release binary embeds ui/dist via
# RustEmbed, and cargo will not compile without it.
[tasks.perf]
depends = ["build:ui"]
dir = "{{config_root}}"
run = ["cargo build --release", "tak run"]

# Same measurement, appended to refs/notes/tak for this commit. Run by the
# `perf` workflow on every push to main; the notes are the history. Safe to run
# locally — nothing leaves the machine until `tak push`.
[tasks."perf:record"]
depends = ["build:ui"]
dir = "{{config_root}}"
run = ["cargo build --release", "tak run --record"]
