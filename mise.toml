min_version = "2026.9.11"

[env]
_.path = ["target/debug", "test/bats/bin"]

[tasks.test]
depends = ["build:ui"]
run = [
  "cargo nextest run",
  "git submodule update --init --recursive",
  "mise run test:bats",
]

[tasks."test:bats"]
description = "Run bats e2e tests"
run = '''
if [ -n "$TRANCHE" ] && [ -n "$TRANCHE_COUNT" ]; then
  tests=$(ls -1 test/*.bats | sort | awk -v t="$TRANCHE" -v n="$TRANCHE_COUNT" 'NR % n == t')
else
  tests="test"
fi
# bats needs GNU parallel or rush to run files concurrently. rush is a mise
# tool so it is always present; GNU parallel is accepted when it happens to be
# installed. Without either, bats silently runs ~430 tests one at a time.
if command -v rush >/dev/null 2>&1; then
  bats --jobs "${BATS_JOBS:-16}" --parallel-binary-name rush $tests
elif command -v parallel >/dev/null 2>&1; then
  bats --jobs "${BATS_JOBS:-16}" $tests
else
  echo "neither rush nor GNU parallel found, running bats sequentially (slow)" >&2
  bats $tests
fi
'''

[tasks.build-dev]
description = "rebuild and restart supervisor (without sudo, as what Agent prefers), to make changes take effect"
depends = ["build"]
run = "pitchfork sup start -f"

[tasks.ci]
depends = ["lint", "build", "build:docs", "test", "test:web-ui"]

[tasks.ci-dev]
depends = ["lint-fix", "build", "build:docs", "test", "render"]

[tasks.docs]
dir = "docs"
run = "aube install && exec aube run docs:dev"

[tasks.lint]
depends = ["build:ui"]
run = "hk check --all"

[tasks.lint-fix]
depends = ["build:ui"]
run = "hk fix --all"

[tasks.build]
depends = ["build:ui"]
run = ["cargo build"]

[tasks."test:web-ui"]
depends = ["build"]
dir = "ui"
run = [
  "aube install",
  "if [ \"$(uname -s)\" = \"Linux\" ]; then node_modules/.bin/playwright install --with-deps chromium; else node_modules/.bin/playwright install chromium; fi",
  "node_modules/.bin/playwright test",
]

[tasks."build:ui"]
dir = "ui"
run = "aube install && exec aube run build && touch ../src/web/static_files.rs"
sources = ["src/**/*"]
outputs = ["dist/**/*"]

[tasks."build:docs"]
dir = "docs"
# `render` rewrites docs/cli and docs/public while this task reads them, so
# when both are scheduled (ci-dev) run this one afterwards.
wait_for = ["render"]
run = "aube install && exec aube run docs:build"

[tasks.render]
depends = ["build"]
# Render with the released CLI matching the usage-rs major version.
run = [
  "pitchfork usage > pitchfork.usage.kdl",
  "rm -rf docs/cli && mkdir -p docs/cli",
  "usage g markdown -mf pitchfork.usage.kdl --out-dir docs/cli --url-prefix /cli",
  "usage g json -f pitchfork.usage.kdl > docs/cli/commands.json",
  "pitchfork schema > docs/public/schema.json",
  "pitchfork api-schema > docs/public/api-schema.json",
  "git add pitchfork.usage.kdl docs",
]

[tasks."render:branding"]
description = "Regenerate logo and icon exports from the approved master PNG"
dir = "docs"
run = "aube install && node .vitepress/render-branding.mjs"

[tasks.install-dev]
depends = ["build:ui"]
env = { "PITCHFORK_LOG" = "debug" }
run = [
  "cargo install --path . --debug",
  "pitchfork sup start -f",
]

[tools]
mr-boxington = { version = "latest", minimum_release_age = "0s" }
usage = { version = "latest", minimum_release_age = "0s" }
# Pinned rather than "latest" because tak is the measuring instrument: an
# upgrade that changes how it samples would land in the series as a step change
# in pitchfork's numbers, indistinguishable from a real regression. Bump deliberately.
tak = { version = "latest", minimum_release_age = "0s" }
aube = { version = "latest", minimum_release_age = "0s" }
cargo-binstall = "latest"
communique = { version = "latest", minimum_release_age = "0s" }
hk = { version = "latest", minimum_release_age = "0s" }
node = "24"
pkl = "latest"
# Parallel runner for bats (see test:bats); replaces GNU parallel.
rush = "latest"
"cargo:cargo-nextest" = "latest"
rust = "stable"

[wrappers.cargo]
command = "mbx"
env = { MBX_CARGO_SHIM_MODE = "1" }

# Instruction-counted benchmarks (see tak.toml). Needs valgrind for the counts;
# without it tak reports wall clock only and says so, so this still works on
# macOS where there is no usable cachegrind.
# `depends` on build:ui because the release binary embeds ui/dist via
# RustEmbed, and cargo will not compile without it.
[tasks.perf]
depends = ["build:ui"]
dir = "{{config_root}}"
run = ["cargo build --release", "tak run"]

# Same measurement, appended to refs/notes/tak for this commit. Run by the
# `perf` workflow on every push to main; the notes are the history. Safe to run
# locally — nothing leaves the machine until `tak push`.
[tasks."perf:record"]
depends = ["build:ui"]
dir = "{{config_root}}"
run = ["cargo build --release", "tak run --record"]
