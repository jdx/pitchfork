name: mise-lock

# Regenerates mise.lock on Renovate branches. Renovate's mise manager rewrites
# the `version =` line in mise.lock but never the per-platform URLs and
# checksums below it, so every mise-action job then runs `mise install --locked`
# against assets from the previous release — either failing outright on a
# checksum mismatch, or silently installing the old binary under the new
# version label. The hosted Mend app this repo uses does not run
# postUpgradeTasks, so the regeneration has to happen here rather than in
# Renovate's own config. This is the mise sibling of aube-lock.yml. See
# jdx/renovate-config for the workflow implementation.

on:
  push:
    branches: ["renovate/**"]

permissions: {}

jobs:
  mise-lock:
    permissions:
      # Pushes the regenerated lockfile back onto the Renovate branch. The
      # shared workflow gates itself on the sender being renovate[bot], so our
      # own fix-up push cannot re-enter it.
      contents: write # commit mise.lock and the regenerated render output
    uses: jdx/renovate-config/.github/workflows/mise-lock.yml@e922356370564d50ee32019effdf4739973cf202 # main
    with:
      # ci-impl's build job runs `mise run render` and fails the branch if it
      # produces a diff. render draws docs/cli from the mise-managed `usage`
      # CLI, so a `usage` bump has to regenerate these in the same commit,
      # otherwise the lockfile fix just trades one red check for another.
      post_update_task: render
      # render's tracked outputs.
      post_update_paths: |
        pitchfork.usage.kdl
        docs/cli
        docs/public/schema.json
        docs/public/api-schema.json
    secrets:
      MISE_LOCK_APP_ID: ${{ secrets.MISE_LOCK_APP_ID }}
      MISE_LOCK_APP_PRIVATE_KEY: ${{ secrets.MISE_LOCK_APP_PRIVATE_KEY }}
